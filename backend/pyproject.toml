[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issuepilot-backend"
version = "0.1.0"
description = "IssuePilot backend: AI-assisted GitHub issue triage with human-in-the-loop approval"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "httpx>=0.27",
  "google-genai>=1.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["triage/prompts/*.md", "demo/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real GitHub / AI APIs (opt-in via LIVE_GITHUB_TESTS=1)"]
addopts = "-m 'not live'"
